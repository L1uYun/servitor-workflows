[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servitor-workflows"
version = "0.1.0"
description = "Dynamic workflow orchestration layer on top of servitor transport"
requires-python = ">=3.11"
dependencies = [
    # editable local servitor dependency resolved at install time
]

[project.scripts]
servitor-workflows = "servitor_workflows.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
